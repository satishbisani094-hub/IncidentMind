<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #0b0f19;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-family="Fira Code, monospace" font-size="22" font-weight="bold">IncidentMind System Architecture</text>
  <text x="500" y="70" text-anchor="middle" fill="#9ca3af" font-family="Inter, sans-serif" font-size="13">Autonomous AI Incident Response with Hindsight Persistent Memory</text>

  <!-- User / Engineer -->
  <g transform="translate(400, 100)" filter="url(#shadow)">
    <rect width="200" height="60" rx="10" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
    <text x="100" y="35" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="600">Site Reliability Engineer</text>
  </g>

  <path d="M 500 160 L 500 200" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>

  <!-- React UI -->
  <g transform="translate(320, 200)" filter="url(#shadow)">
    <rect width="360" height="70" rx="12" fill="url(#grad-blue)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="180" y="35" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">React Frontend UI (Vite + Tailwind CSS)</text>
    <text x="180" y="55" text-anchor="middle" fill="#e0e7ff" font-family="Fira Code, monospace" font-size="11">Dashboard • Incident Catalog • Memory Explorer • Learning Demo</text>
  </g>

  <path d="M 500 270 L 500 310" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Express API Backend -->
  <g transform="translate(300, 310)" filter="url(#shadow)">
    <rect width="400" height="75" rx="12" fill="#111827" stroke="#4f46e5" stroke-width="2"/>
    <text x="200" y="35" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Express.js API Backend</text>
    <text x="200" y="55" text-anchor="middle" fill="#9ca3af" font-family="Fira Code, monospace" font-size="11">REST Router • Incident Controller • Analytics Service</text>
  </g>

  <!-- Connectors from Express to Subsystems -->
  <path d="M 380 385 L 220 450" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 500 385 L 500 450" stroke="#10b981" stroke-width="2"/>
  <path d="M 620 385 L 780 450" stroke="#06b6d4" stroke-width="2"/>

  <!-- AI Agent Engine -->
  <g transform="translate(100, 450)" filter="url(#shadow)">
    <rect width="240" height="130" rx="12" fill="url(#grad-purple)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="bold">AI Agent Engine</text>
    <text x="120" y="52" text-anchor="middle" fill="#e9d5ff" font-family="Fira Code, monospace" font-size="11">Gemini / OpenAI API</text>
    <line x1="20" y1="65" x2="220" y2="65" stroke="#a855f7" stroke-width="1"/>
    <text x="120" y="85" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">Tool Calling Execution:</text>
    <text x="120" y="105" text-anchor="middle" fill="#f3e8ff" font-family="Fira Code, monospace" font-size="10">recallIncidentMemory() • analyzeLogs()</text>
  </g>

  <!-- Hindsight Persistent Memory -->
  <g transform="translate(380, 450)" filter="url(#shadow)">
    <rect width="240" height="130" rx="12" fill="url(#grad-emerald)" stroke="#34d399" stroke-width="2"/>
    <text x="120" y="30" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Hindsight Memory Engine</text>
    <text x="120" y="52" text-anchor="middle" fill="#a7f3d0" font-family="Fira Code, monospace" font-size="11">@vectorize-io/hindsight-client</text>
    <line x1="20" y1="65" x2="220" y2="65" stroke="#059669" stroke-width="1"/>
    <text x="120" y="85" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold">RETAIN & RECALL Operations</text>
    <text x="120" y="105" text-anchor="middle" fill="#ecfdf5" font-family="Fira Code, monospace" font-size="10">World Facts • Experiences • Root Causes</text>
  </g>

  <!-- Incident Database -->
  <g transform="translate(660, 450)" filter="url(#shadow)">
    <rect width="240" height="130" rx="12" fill="#1f2937" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Database Repository</text>
    <text x="120" y="52" text-anchor="middle" fill="#67e8f9" font-family="Fira Code, monospace" font-size="11">PostgreSQL / SQLite</text>
    <line x1="20" y1="65" x2="220" y2="65" stroke="#374151" stroke-width="1"/>
    <text x="120" y="85" text-anchor="middle" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11">Persisted Relational Schemas:</text>
    <text x="120" y="105" text-anchor="middle" fill="#e0f2fe" font-family="Fira Code, monospace" font-size="10">incidents • agent_analyses • memories</text>
  </g>

  <!-- Output Banner -->
  <g transform="translate(200, 620)" filter="url(#shadow)">
    <rect width="600" height="50" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="300" y="30" text-anchor="middle" fill="#34d399" font-family="Fira Code, monospace" font-size="13" font-weight="bold">RESULT: Personalized Incident Diagnosis & Verified Historical Resolution</text>
  </g>
</svg>
